name: Replace public MBAAZI APK once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-apk-once.yml"

permissions:
  contents: write

jobs:
  replace-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public downloads repo
        uses: actions/checkout@v4

      - name: Download latest built APK artifact
        env:
          APK_ZIP_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6d50-8246-a94c-b6dcc1e91da1/raw?se=2026-09-22T08%3A31%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=b814479b-cbfe-5704-b3b8-eb63a706045e&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T06%3A14%3A05Z&ske=2026-09-23T06%3A14%3A05Z&sks=b&skv=2026-02-06&sig=NNyN8aEYp/w4RtlHFmCUIHOLoH2KBXApdYrqo3evhx4%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$APK_ZIP_URL" -o /tmp/mbaazi.zip
          rm -rf /tmp/mbaazi-apk
          mkdir -p /tmp/mbaazi-apk
          unzip -o /tmp/mbaazi.zip -d /tmp/mbaazi-apk
          APK_FILE="$(find /tmp/mbaazi-apk -type f -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          cp "$APK_FILE" "PLANER-KRYZYSOWY-MBAAZI.apk"

      - name: Commit replacement and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "PLANER-KRYZYSOWY-MBAAZI.apk"
          git rm ".github/workflows/update-apk-once.yml"
          git commit -m "Update public MBAAZI APK with OAEP fix"
          git push
