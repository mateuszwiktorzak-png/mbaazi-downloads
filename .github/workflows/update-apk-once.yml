name: Replace public MBAAZI APK once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-apk-once.yml"

permissions:
  contents: write

jobs:
  replace-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public downloads repo
        uses: actions/checkout@v4

      - name: Download latest built APK artifact
        env:
          APK_ZIP_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-d4e4-8246-b451-70b1ca969b1b/raw?se=2026-09-21T11%3A54%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=fe3ef148-4a06-5805-854c-21fb1ad7da6b&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T05%3A36%3A55Z&ske=2026-09-22T05%3A36%3A55Z&sks=b&skv=2026-02-06&sig=%2B9a4xQQG4KMY6L7ifbhSsIxkuRObWZ338xILOfNUOu8%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$APK_ZIP_URL" -o /tmp/mbaazi.zip
          rm -rf /tmp/mbaazi-apk
          mkdir -p /tmp/mbaazi-apk
          unzip -o /tmp/mbaazi.zip -d /tmp/mbaazi-apk
          APK_FILE="$(find /tmp/mbaazi-apk -type f -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          cp "$APK_FILE" "PLANER-KRYZYSOWY-MBAAZI.apk"
          ls -lh "PLANER-KRYZYSOWY-MBAAZI.apk"

      - name: Commit replacement and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "PLANER-KRYZYSOWY-MBAAZI.apk"
          git rm ".github/workflows/update-apk-once.yml"
          git commit -m "Update public MBAAZI APK"
          git push
